name: Verify BugCapsule

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6, reads packageManager in package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Type-check and build the production extension
        run: pnpm build
      - run: node scripts/package-extension.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Reproduce defects and validate the offline A/B protocol
        run: pnpm eval:run --out eval/outputs/ci-mock
